<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GalGen 管理器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-mark">G</span>
        <span class="brand-text">GalGen</span>
      </div>
      <nav id="nav">
        <a href="#" data-page="characters" class="nav-item active">角色</a>
        <a href="#" data-page="scenes" class="nav-item">场景</a>
        <a href="#" data-page="plots" class="nav-item">剧情</a>
        <a href="#" data-page="chapters" class="nav-item">章节</a>
        <a href="#" data-page="endings" class="nav-item">结局</a>
        <a href="#" data-page="functions" class="nav-item">函数</a>
        <a href="#" data-page="assets" class="nav-item">资产</a>
        <a href="#" data-page="ai" class="nav-item">AI</a>
        <a href="#" data-page="build" class="nav-item">生成</a>
        <a href="#" data-page="settings" class="nav-item">设置</a>
      </nav>
      <div class="sidebar-foot">
        <button id="btn-validate" class="btn btn-ghost" title="校验项目完整性">校验</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="project-title">GalGen 管理器</div>
        <div class="topbar-right">
          <div class="actions">
            <button id="btn-new" class="btn btn-sm btn-icon" title="新建项目（Ctrl+Shift+N）">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm4 12h-4v4h-2v-4H8v-2h4v-4h2v4h4v2z"/></svg>
            </button>
            <button id="btn-open" class="btn btn-sm btn-icon" title="打开项目…（Ctrl+O）">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            </button>
            <button id="btn-save-as" class="btn btn-sm btn-icon" title="另存为…（Ctrl+Shift+S）">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            </button>
            <button id="btn-save" class="btn btn-sm btn-primary btn-icon" title="保存（Ctrl+S）">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            </button>
          </div>
          <div id="status"></div>
        </div>
      </header>
      <section id="page-host"></section>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="js/vendor/sortable.min.js"></script>
  <script src="js/vendor/alpine.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/plots.js"></script>
</body>
</html>
